services:
  postgres:
    image: postgres:16
    container_name: skytest-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skytest_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${SKYTEST_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skytest_agent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - skytest-local-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: skytest-local-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${SKYTEST_MINIO_API_PORT:-9000}:9000"
      - "${SKYTEST_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - skytest-local-minio:/data

  create-minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint:
      - /bin/sh
    command:
      - -ec
      - |
        until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
          sleep 1
        done
        /usr/bin/mc mb -p local/skytest-agent >/dev/null 2>&1 || true

  authgear-redis:
    image: redis:8.4
    container_name: skytest-local-authgear-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  authgear:
    image: quay.io/theauthgear/authgear-server:latest
    container_name: skytest-local-authgear
    restart: unless-stopped
    entrypoint: /app/entrypoint.sh
    command: authgear start
    environment:
      DEV_MODE: "true"
      LOG_LEVEL: "warning"
      TRUST_PROXY: "true"
      DATABASE_SCHEMA: "authgear"
      CONFIG_SOURCE_DIRECTORY: /app
      MAIN_LISTEN_ADDR: "0.0.0.0:3001"
      ADMIN_LISTEN_ADDR: "0.0.0.0:3002"
      RESOLVER_LISTEN_ADDR: "0.0.0.0:3003"
    ports:
      - "${SKYTEST_AUTHGEAR_MAIN_PORT:-3301}:3001"
      - "${SKYTEST_AUTHGEAR_ADMIN_PORT:-3302}:3002"
      - "${SKYTEST_AUTHGEAR_RESOLVER_PORT:-3303}:3003"
    volumes:
      - ../authgear/entrypoint.sh:/app/entrypoint.sh:ro
      - ../authgear/authgear.yaml:/app/authgear.yaml:ro
      - ../authgear/authgear.features.yaml:/app/authgear.features.yaml:ro
      - ../authgear/authgear.secrets.yaml.tpl:/app/authgear.secrets.yaml.tpl:ro
    depends_on:
      postgres:
        condition: service_healthy
      authgear-redis:
        condition: service_healthy
      prepare-authgear-db:
        condition: service_completed_successfully

  prepare-authgear-db:
    image: postgres:16
    container_name: skytest-local-authgear-db-prepare
    restart: "no"
    environment:
      PGPASSWORD: postgres
    entrypoint:
      - /bin/sh
    command:
      - -ec
      - |
        until pg_isready -h postgres -U postgres -d skytest_agent >/dev/null 2>&1; do
          sleep 1
        done
        psql -h postgres -U postgres -d skytest_agent -c "CREATE SCHEMA IF NOT EXISTS authgear;"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  skytest-local-postgres:
  skytest-local-minio:
