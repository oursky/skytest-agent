[extend]
useDefault = true

[allowlist]
description = "Paths excluded from secret scanning (vendored deps, build artifacts, lockfiles)."
paths = [
    '''(^|/)node_modules/''',
    '''(^|/)\.next/''',
    '''(^|/)\.turbo/''',
    '''(^|/)\.cache/''',
    '''(^|/)dist/''',
    '''(^|/)build/''',
    '''(^|/)out/''',
    '''(^|/)coverage/''',
    '''(^|/)test-results/''',
    '''(^|/)playwright-report/''',
    '''(^|/)package-lock\.json$''',
]

[[rules]]
id = "slack-token"
description = "Slack bot/user/app token"
regex = '''xox(?:b|p|a)-[0-9A-Za-z-]{10,}'''
