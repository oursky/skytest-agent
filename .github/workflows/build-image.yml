name: Build Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short tag
        id: shorttag
        run: |
          set -euo pipefail
          # Must match `git rev-parse --short=8 HEAD`, which is how some orchestrators derive the
          # image tag from the checked-out commit. Git can return more than 8 characters when 8
          # would be ambiguous; consumers should verify the tag exists rather than assume it.
          short="$(git rev-parse --short=8 HEAD)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "Publishing git-$short"

      - name: Build and push
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          push: true
          tags: ghcr.io/oursky/skytest-agent:latest,ghcr.io/oursky/skytest-agent:${{ github.sha }},ghcr.io/oursky/skytest-agent:git-${{ steps.shorttag.outputs.short }}
          build-args: |
            SKYTEST_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          IMAGE_REF="ghcr.io/oursky/skytest-agent@${DIGEST}"
          {
            echo "## Image Built"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "**Image ref:**"
            echo ""
            echo "\`\`\`"
            echo "${IMAGE_REF}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  image-scan:
    needs: build
    runs-on: [self-hosted, linux, x64, v1]
    env:
      IMAGE_REF: ghcr.io/oursky/skytest-agent@${{ needs.build.outputs.digest }}
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.73.0
    steps:
      - name: Refresh Trivy DB cache
        env:
          DB_MAX_AGE: '86400'
        run: |
          set -euo pipefail
          trivy_cache_dir="$HOME/.cache/trivy-0.73.0"
          mkdir -p "$trivy_cache_dir"
          db="$trivy_cache_dir/db/trivy.db"
          if [ -f "$db" ] && \
             [ "$(( $(date +%s) - $(stat -c %Y "$db") ))" -lt "$DB_MAX_AGE" ]; then
            echo "Trivy DB is fresh; reusing cache."
          else
            docker run --rm \
              -v "$trivy_cache_dir:/root/.cache/" \
              "$TRIVY_IMAGE" image --download-db-only
          fi

      - name: Vulnerability scan
        run: |
          set -euo pipefail
          trivy_cache_dir="$HOME/.cache/trivy-0.73.0"
          for attempt in 1 2 3; do
            docker pull "$IMAGE_REF" && break
            [ "$attempt" -lt 3 ] || { echo "docker pull failed after 3 attempts." >&2; exit 1; }
            echo "Pull attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          docker run --rm \
            -v "$trivy_cache_dir:/root/.cache/" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --image-src docker \
              --scanners vuln \
              --skip-db-update \
              --skip-java-db-update \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --timeout 15m \
              "$IMAGE_REF"
